<style>
@font-face { font-family: 'Anton'; src: url('anton.woff') format('woff'); font-display: swap; }

:root { --ink:#111111; --paper:#FFFDF8; --sand:#F3F1EA; --yellow:#FDE68A; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: Barlow, Roboto, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
body { padding: env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 90px) env(safe-area-inset-left); }
.wrap { max-width: 560px; margin: 0 auto; }
.d { font-family: Anton, Impact, sans-serif; font-weight: 400; letter-spacing: .01em; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
.hero { background: var(--ink); color: #fff; padding: 22px 18px 20px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.hero small { display: block; color: var(--yellow); font-weight: 800; letter-spacing: .14em; font-size: 12px; }
.hero h1 { margin: 6px 0 0; font-size: 38px; line-height: .98; }
.hero h1 span { color: #FF7A1A; }
.sec { padding: 18px 16px 0; }
.sec > .t { font-size: 24px; margin: 0 0 10px; }
.next { display: flex; align-items: center; gap: 14px; width: 100%; border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); border-radius: 16px; padding: 12px 16px; text-align: left; }
.next .big { font-size: 64px; line-height: .9; }
.next b { display: block; font-size: 13px; letter-spacing: .12em; }
.next .w { font-size: 26px; line-height: 1; }
.grid4 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.tile { border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); border-radius: 14px; padding: 8px 12px 12px; text-align: left; min-height: 132px; display: flex; flex-direction: column; }
.tile .L { font-size: 60px; line-height: .95; }
.tile .w { font-size: 19px; line-height: 1.05; }
.tile small { font-weight: 700; font-size: 13px; margin-top: 2px; }
.list { display: flex; flex-direction: column; gap: 10px; }
.lnk { display: flex; align-items: center; gap: 12px; background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 12px 14px; text-align: left; width: 100%; min-height: 56px; }
.lnk .ic { flex: none; width: 40px; height: 40px; border-radius: 10px; border: 3px solid var(--ink); display: flex; align-items: center; justify-content: center; font-size: 20px; }
.lnk .w { font-size: 20px; line-height: 1; }
.lnk small { display: block; font-weight: 600; font-size: 13px; color: #374151; }
.top { position: sticky; top: 0; z-index: 5; border-bottom: 3px solid var(--ink); padding: 10px 16px 12px; }
.back { background: var(--ink); color: #fff; border: 0; border-radius: 99px; padding: 8px 14px; font-weight: 800; font-size: 14px; min-height: 40px; }
.top .row { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
.top .L { font-size: 72px; line-height: .85; }
.top .k { font-size: 12px; font-weight: 800; letter-spacing: .12em; }
.top h1 { margin: 2px 0 0; font-size: 34px; line-height: .95; }
.warm { margin: 14px 16px 0; background: var(--ink); color: #fff; border-radius: 12px; padding: 10px 14px; font-weight: 600; font-size: 15px; }
.warm .d { color: var(--yellow); font-size: 18px; margin-right: 6px; }
.ex { margin: 12px 16px 0; background: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 12px 14px 14px; }
.ex .hd { display: flex; align-items: center; gap: 10px; }
.num { flex: none; width: 36px; height: 36px; border-radius: 99px; border: 3px solid var(--ink); display: flex; align-items: center; justify-content: center; font-size: 19px; }
.ex .nm { font-size: 24px; line-height: 1; flex: 1; }
.ex .sets { font-size: 34px; line-height: 1; }
.vis { margin-top: 10px; background: var(--sand); border-radius: 12px; display: flex; justify-content: center; padding: 4px; }
.vis svg { width: 100%; max-width: 360px; height: auto; }
.sticker { display: inline-block; transform: rotate(-1.5deg); background: var(--yellow); border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); font-weight: 800; font-size: 15px; text-transform: uppercase; padding: 4px 10px; border-radius: 6px; margin-top: 12px; }
.tip { margin-top: 10px; font-size: 15px; font-weight: 600; color: #374151; line-height: 1.35; }

.ctr { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.boxes { display: flex; gap: 8px; flex-wrap: wrap; }
.bx { width: 44px; height: 44px; border: 3px solid var(--ink); border-radius: 10px; background: #fff; font-size: 22px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.bx.on { background: var(--ink); color: #fff; }
.rest { border: 3px solid var(--ink); border-radius: 99px; background: var(--yellow); padding: 8px 14px; font-weight: 800; font-size: 14px; min-height: 44px; }
.done { display: block; width: calc(100% - 32px); margin: 18px 16px 0; background: var(--ink); color: #fff; border: 0; border-radius: 14px; padding: 16px; font-size: 22px; }
.note { margin: 12px 16px 0; font-size: 14px; font-weight: 600; color: #374151; }
.timer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--ink); color: #fff; padding: 12px 18px calc(12px + env(safe-area-inset-bottom)); display: none; align-items: center; justify-content: space-between; gap: 12px; }
.timer.on { display: flex; }
.timer .d { font-size: 40px; color: var(--yellow); }
.timer button { background: #fff; color: var(--ink); border: 0; border-radius: 99px; padding: 10px 16px; font-weight: 800; min-height: 44px; }
.card { margin: 12px 16px 0; background: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 12px 14px; }
.card.warn { background: #FEE2E2; }

.h3 { font-family: Anton, Impact, sans-serif; font-size: 20px; }
.phases { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; margin: 12px 16px 0; }
.ph { background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 8px 6px 10px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.ph .d { font-size: 18px; }
.ph .s { background: var(--yellow); border: 2px solid var(--ink); border-radius: 6px; font-weight: 800; font-size: 11px; text-transform: uppercase; padding: 2px 5px; transform: rotate(-1.5deg); }
.ph small { font-size: 12px; font-weight: 600; line-height: 1.25; }
.ph svg { width: 100%; height: auto; background: var(--sand); border-radius: 8px; }
.grip { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; margin-top: 8px; text-align: center; }
.grip b { display: block; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 17px; margin-top: 4px; }
.grip small { font-size: 13px; font-weight: 600; }
.gbox { background: var(--sand); border-radius: 10px; border: 3px solid; display: flex; justify-content: center; }
.gbox.ok { border-color: #16A34A; } .gbox.no { border-color: #B91C1C; }
.tipl { display: flex; gap: 10px; margin-top: 10px; align-items: flex-start; }
.tipl .n { flex: none; width: 30px; text-align: center; background: var(--yellow); border: 2px solid var(--ink); border-radius: 6px; font-family: Anton, Impact, sans-serif; font-size: 18px; }
.tipl div { font-size: 15px; line-height: 1.3; }
.bad { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.bad span { background: #FEE2E2; border: 2px solid var(--ink); border-radius: 99px; padding: 4px 10px; font-weight: 700; font-size: 14px; }
.path { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.step { border: 3px solid var(--ink); border-radius: 12px; padding: 8px 12px; display: flex; align-items: center; gap: 10px; background: #fff; }
.step .d { font-size: 26px; width: 22px; }
.step.here { color: #111; }
.chk { display: flex; align-items: center; gap: 10px; font-weight: 700; margin-top: 10px; font-size: 16px; }
.chk input { width: 24px; height: 24px; accent-color: #111; }
.meas { display: flex; flex-direction: column; gap: 12px; }
.mz { display: flex; gap: 12px; align-items: center; }
.mz .b { flex: none; width: 50px; height: 50px; border-radius: 12px; border: 3px solid var(--ink); display: flex; align-items: center; justify-content: center; font-size: 30px; }
.mz .w { font-size: 20px; line-height: 1.05; }
.mz small { display: block; font-weight: 600; color: #374151; font-size: 14px; }
.pdj { display: grid; gap: 10px; }
.goal { background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 10px 14px; }
.goal .l { font-weight: 800; font-size: 13px; letter-spacing: .06em; }
.goal .v { display: flex; align-items: baseline; gap: 8px; }
.goal small { font-weight: 600; color: #374151; }
.g2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.mode { display: grid; grid-template-columns: 1fr 1fr; border: 3px solid var(--ink); border-radius: 14px; overflow: hidden; background: #fff; }
.mode button { border: 0; background: #fff; padding: 12px 6px; font-family: Anton, Impact, sans-serif; font-size: 20px; min-height: 52px; }
.mode button.on { background: var(--ink); color: var(--yellow); }
.mode small { display: block; font-family: Barlow, Roboto, sans-serif; font-weight: 700; font-size: 12px; color: inherit; opacity: .8; }
.gear { margin-top: 8px; font-size: 14px; font-weight: 700; display: flex; gap: 6px; align-items: center; }
.gear span { background: var(--sand); border: 2px solid var(--ink); border-radius: 99px; padding: 2px 10px; }
.emom { border: 3px solid var(--ink); border-radius: 99px; background: #86EFAC; padding: 8px 14px; font-weight: 800; font-size: 14px; min-height: 44px; }
.mode.three { grid-template-columns: 1fr 1fr 1fr; }
.mode.three button { font-size: 17px; }
.mode button.on.mob { background: #14B8A6; color: #111; }
.rt { border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); border-radius: 16px; padding: 12px 16px; display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; margin-bottom: 12px; }
.rt .big { font-size: 46px; line-height: .9; }
.rt .w { font-size: 24px; line-height: 1; }
.rt small { display: block; font-weight: 700; font-size: 13px; }
.rt .play { margin-left: auto; flex: none; width: 52px; height: 52px; border-radius: 99px; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; }
.mv { margin: 10px 0 0; background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 10px 12px; }
.mv .hd { display: flex; align-items: center; gap: 10px; }
.mv .nm { font-size: 19px; line-height: 1.05; flex: 1; }
.mv .du { font-size: 20px; }
.player { position: fixed; inset: 0; z-index: 20; background: var(--paper); display: none; flex-direction: column; padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px); }
.player.on { display: flex; }
.player .bar { height: 10px; border: 2px solid var(--ink); border-radius: 99px; overflow: hidden; background: #fff; }
.player .bar div { height: 100%; background: #14B8A6; width: 0; }
.player .count { font-size: 96px; line-height: 1; text-align: center; }
.player .nm { font-size: 30px; line-height: 1; text-align: center; margin-top: 8px; }
.player .side { text-align: center; font-weight: 800; letter-spacing: .1em; margin-top: 4px; }
.player .vis svg { width: 100%; max-width: 420px; height: auto; }
.player .btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: auto; }
.player .btns button { border: 3px solid var(--ink); border-radius: 14px; background: #fff; padding: 14px 6px; font-weight: 800; font-size: 16px; min-height: 52px; }
.player .btns button.main { background: var(--ink); color: #fff; }
.player .nx { text-align: center; font-weight: 700; color: #374151; margin-top: 6px; font-size: 14px; }
.foot { margin: 22px 16px 0; font-size: 13px; color: #4B5563; font-weight: 600; text-align: center; }

body { padding-bottom: calc(env(safe-area-inset-bottom) + 150px); }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--ink); display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom); }
.nav button { background: none; border: 0; color: #9CA3AF; padding: 10px 1px 12px; font-family: Anton, Impact, sans-serif; font-size: 12px; min-height: 56px; letter-spacing: .02em; }
.nav button.on { color: var(--yellow); }
.nav button span { display: block; font-family: Barlow, Roboto, sans-serif; font-weight: 800; font-size: 18px; line-height: 1; margin-bottom: 2px; }
.timer { bottom: calc(env(safe-area-inset-bottom) + 56px); }
.lvl { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 6px; font-size: 13px; font-weight: 700; color: #374151; }
.lvl .badge { background: var(--sand); border: 2px solid var(--ink); border-radius: 99px; padding: 1px 8px; font-weight: 800; color: var(--ink); white-space: nowrap; }
.rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.rate button { border: 3px solid var(--ink); border-radius: 12px; background: #fff; padding: 8px 4px; font-weight: 800; font-size: 14px; min-height: 48px; }
.rate button small { display: block; font-weight: 600; font-size: 11px; }
.rate button.on.dur { background: #FCA5A5; } .rate button.on.ok { background: #86EFAC; } .rate button.on.fac { background: #93C5FD; }
.maxin { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.maxin label { display: flex; flex-direction: column; font-size: 12px; font-weight: 800; }
.maxin input { width: 64px; min-height: 44px; border: 3px solid var(--ink); border-radius: 10px; font: inherit; font-weight: 800; font-size: 18px; text-align: center; }
.banner { margin: 12px 16px 0; border: 3px solid var(--ink); border-radius: 12px; padding: 10px 14px; font-weight: 700; font-size: 14px; }
.dots { display: flex; gap: 8px; margin-top: 8px; }
.dots span { width: 34px; height: 34px; border-radius: 99px; border: 3px solid var(--ink); display: flex; align-items: center; justify-content: center; font-family: Anton, Impact, sans-serif; font-size: 16px; background: #fff; }
.stat { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.stat div { background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 10px 12px; }
.stat b { display: block; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 32px; line-height: 1; }
.stat small { font-weight: 700; font-size: 13px; }
.row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 2px dotted #C9C5BA; font-size: 14px; font-weight: 600; }
.row:last-child { border-bottom: 0; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.form label { font-size: 13px; font-weight: 800; display: flex; flex-direction: column; gap: 4px; }
.form input { min-height: 44px; border: 2px solid var(--ink); border-radius: 10px; font: inherit; font-weight: 700; padding: 6px 10px; }
.btn { border: 3px solid var(--ink); border-radius: 12px; background: var(--yellow); padding: 12px 14px; font-weight: 800; font-size: 15px; min-height: 48px; }
.btn.dark { background: var(--ink); color: #fff; }
.up { color: #15803D; font-weight: 800; } .down { color: #B91C1C; font-weight: 800; }
.chart svg { width: 100%; height: auto; }
body.night { background: #0B1020; color: #E5E7EB; }
body.night .wrap { color: #E5E7EB; }
body.night .card, body.night .mv, body.night .lnk { background: #151B30; border-color: #334155; color: #E5E7EB; }
body.night .lnk small, body.night .tip, body.night .note, body.night .mv .tip { color: #94A3B8; }
body.night .vis, body.night .player .vis { background: #64748B !important; }
body.night .t { color: #E5E7EB; }
body.night .sticker { background: #312E81; color: #E0E7FF; border-color: #6366F1; box-shadow: none; }
body.night .rt { border-color: #334155; box-shadow: none; }
body.night .player { background: #0B1020; color: #CBD5E1; }
body.night .player .btns button { background: #151B30; color: #CBD5E1; border-color: #334155; }
body.night .player .btns button.main { background: #312E81; }
body.night .player .count { color: #CBD5E1 !important; }
body.night .player .bar { border-color: #334155; background: #151B30; } body.night .player .bar div { background: #6366F1; }
body.night .nx { color: #94A3B8; }
.breath { display: none; flex-direction: column; align-items: center; gap: 6px; margin-top: 6px; }
.breath.on { display: flex; }
.breath .orb { width: 70px; height: 70px; border-radius: 99px; background: #6366F1; opacity: .85; transform: scale(.6); }
.breath .lab { font-family: Anton, Impact, sans-serif; font-size: 24px; letter-spacing: .04em; }
@keyframes mp { 0%,100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,122,26,.6); } 50% { transform: scale(1.06); box-shadow: 0 0 0 22px rgba(255,122,26,0); } }
.micpulse { animation: mp 1.4s ease-in-out infinite; }
#app::after { content: ''; display: block; height: 90px; }
.wsolo button { aspect-ratio: auto !important; min-height: 96px; }
.swthumb svg { width: 100% !important; height: auto !important; display: block; }
#printzone { display: none; }
@media print { html, body { background: #fff !important; } body > *:not(#printzone) { display: none !important; } #printzone { display: block !important; color: #111; font-family: -apple-system, Roboto, Arial, sans-serif; } @page { margin: 12mm; } .pz-head { display: flex; flex-direction: column; } .pz-k { font-weight: 800; letter-spacing: .15em; font-size: 10pt; color: #FF7A1A; } .pz-t { font-family: Anton, Impact, sans-serif; font-size: 30pt; line-height: 1.05; } .pz-bar { width: 50mm; height: 3mm; background: #FACC15; margin: 3mm 0 5mm; } .pz-meta { width: 100%; border-collapse: collapse; margin-bottom: 4mm; font-size: 10pt; } .pz-meta td { border: 1.5pt solid #111; padding: 2mm 3mm; } .pz-notes { border: 1.5pt solid #111; border-radius: 3mm; padding: 3mm; font-size: 10pt; margin-bottom: 5mm; background: #FFFBEB; } .pz-s { break-inside: avoid; margin-bottom: 6mm; } .pz-sh { display: flex; align-items: center; gap: 3mm; border-bottom: 2pt solid; padding-bottom: 2mm; margin-bottom: 2mm; } .pz-sh b { font-family: Anton, Impact, sans-serif; font-size: 16pt; font-weight: 400; } .pz-sh small { display: block; font-size: 9pt; color: #555; } .pz-n { display: inline-flex; width: 9mm; height: 9mm; border-radius: 50%; border: 1.5pt solid #111; align-items: center; justify-content: center; font-family: Anton, Impact, sans-serif; font-size: 13pt; } .pz-ex { width: 100%; border-collapse: collapse; font-size: 10pt; } .pz-ex th { text-align: left; font-size: 8pt; letter-spacing: .08em; text-transform: uppercase; border-bottom: 1pt solid #111; padding: 1mm; } .pz-ex td { border-bottom: .5pt solid #ccc; padding: 1.5mm 1mm; vertical-align: middle; } .pz-ex td small { display: block; color: #555; font-size: 8.5pt; } .pz-ex td.c { text-align: center; font-weight: 800; font-size: 12pt; } .pz-img { width: 30mm; } .pz-img svg { width: 30mm !important; height: auto !important; } .pz-ex tr { break-inside: avoid; } .pz-foot { margin-top: 6mm; font-size: 8pt; color: #666; border-top: .5pt solid #ccc; padding-top: 2mm; } }

<body>
<div class="wrap" id="app"></div>
<div class="timer" id="timer" role="status" aria-live="polite"><div><div style="font-size:12px;font-weight:800;letter-spacing:.12em">CHRONO</div><div class="d" id="tval" style="font-size:32px">0:00</div></div><div style="display:flex;gap:8px"><button type="button" id="tplus">+15 s</button><button type="button" id="tstop">Stop</button></div></div>

    + '<div class="note" style="margin:8px 0 0">Le code ne marche qu\'avec ce pseudo exact. Un ami qui le donne à quelqu\'un d\'autre ne lui sert à rien.</div></div>';
  h += '<div class="sec"><div class="t d">MON QR CODE</div><div class="card" style="margin:0;text-align:center"><img src="' + QR_PNG + '" alt="QR code de l\'appli" style="width:70%;max-width:260px;image-rendering:pixelated"><p style="margin:6px 0 0">Fais-le scanner, ou partage-le : il ouvre directement l\'appli. Sans code, personne ne peut entrer.</p><button type="button" class="btn dark" data-adm="qr" style="width:100%;margin-top:10px">Partager le QR code</button></div></div>';
  h += '<div class="sec"><div class="t d">LIEN DE L\'APPLI</div><input id="cg-link" value="' + esc(ST.applink || APP_URL) + '" style="width:100%;min-height:50px;border:2px solid #111;border-radius:10px;font:inherit;padding:6px 10px"><div class="note" style="margin:6px 0 0">Ajouté automatiquement au message pour ton ami.</div></div>';
  var L = ST.codes || [], act = L.filter(function (x) { return x.st === 'active'; }).length;
  h += '<div class="sec"><div class="t d">QUI A ACCÈS</div><div class="stat"><div><b>' + act + '</b><small>accès activés</small></div><div><b>' + (L.length - act) + '</b><small>invitations en attente</small></div></div>';
  h += '<div class="card" style="margin:10px 0 0">' + (L.length ? L.map(function (x) { var on = x.st === 'active'; return '<div class="row" style="flex-direction:column;align-items:stretch;gap:8px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span><b style="font-size:17px">' + esc(x.p) + '</b><small style="display:block;color:#6B7280">Invité le ' + esc(x.d) + (on && x.da ? ' · activé le ' + esc(x.da) : '') + '</small></span><span style="border:2px solid #111;border-radius:99px;padding:3px 10px;font-weight:800;font-size:12px;background:' + (on ? '#86EFAC' : '#FDE68A') + '">' + (on ? '✓ ACTIVÉ' : 'EN ATTENTE') + '</span></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button type="button" data-adm="cp|' + esc(x.p) + '|' + esc(x.c) + '" style="border:2px solid #111;border-radius:99px;background:#fff;font-weight:800;min-height:36px;padding:0 10px">Copier le lien</button><button type="button" data-adm="st|' + esc(x.p) + '" style="border:2px solid #111;border-radius:99px;background:#fff;font-weight:800;min-height:36px;padding:0 10px">' + (on ? 'Remettre en attente' : 'Marquer activé') + '</button><button type="button" data-adm="del|' + esc(x.p) + '" style="border:2px solid #B91C1C;color:#B91C1C;border-radius:99px;background:#fff;font-weight:800;min-height:36px;padding:0 10px">Retirer</button></div></div>'; }).join('') : '<p>Aucune invitation pour l\'instant.</p>') + '</div>';
  h += '<div class="note" style="margin:8px 0 0">L\'appli n\'envoie aucune donnée : quand ton ami active son accès, elle lui propose de te prévenir par e-mail. Tu reçois « Mon Coach : accès activé (pseudo) », puis tu touches « Marquer activé ».</div></div>';
  h += '<div class="sec"><button type="button" class="btn" data-adm="off" style="width:100%">Désactiver le mode créateur sur ce téléphone</button></div>';
  return h;
}
